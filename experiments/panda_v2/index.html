<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>动物拼图 · 熊猫交互验证</title>
<style>
body{margin:0;background:#f8f0e0;color:#2c3540;font:16px system-ui;text-align:center}main{max-width:850px;margin:auto;padding:24px}button{padding:10px 18px;margin:7px;background:white;border:2px solid #667687;border-radius:9px;cursor:pointer;font:inherit}canvas{display:block;max-width:100%;margin:12px auto;touch-action:none;border-radius:12px;background:#e4cb9f}#done{display:none}#message{min-height:26px}
</style><main><h1>🐼 动物拼图 · 熊猫测试</h1><p>拖动动物放入棋盘；拖出棋盘即可取回；R 键旋转</p><div id="message"></div><canvas id="game" width="800" height="570"></canvas><div><button id="rotate">旋转 R</button><button id="reset">重置本关</button><button id="next" disabled>下一关</button></div><p id="done">三关完成！</p></main>
<script>
'use strict';
const img=new Image();img.src='../../assets/animals/panda_rect6_v2.png';
const C=document.getElementById('game'),ctx=C.getContext('2d'),cell=85,step=88;
const levels=[
 {w:3,h:2,blocks:[{id:'P',kind:'panda',cells:[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]]}]},
 {w:5,h:2,blocks:[{id:'P',kind:'panda',cells:[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]]},{id:'B',kind:'block',cells:[[0,0],[1,0],[0,1],[1,1]]}]},
 {w:4,h:3,blocks:[{id:'P',kind:'panda',cells:[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]]},{id:'C',kind:'block',cells:[[0,0],[1,0],[2,0]]},{id:'D',kind:'block',cells:[[0,0],[1,0],[2,0]]}]}
];
let index=0,pieces=[],held=null,selection=null,mouse={x:0,y:0},board={x:0,y:0};
function shape(p){let a=p.base.map(([x,y])=>p.rot===0?[x,y]:p.rot===1?[-y,x]:p.rot===2?[-x,-y]:[y,-x]);let mx=Math.min(...a.map(q=>q[0])),my=Math.min(...a.map(q=>q[1]));return a.map(([x,y])=>[x-mx,y-my]);}
function dims(a){return [Math.max(...a.map(q=>q[0]))+1,Math.max(...a.map(q=>q[1]))+1]}
function legal(p,at){let l=levels[index],used=new Set();for(let q of pieces){if(q===p||!q.at)continue;for(let [x,y] of shape(q))used.add((x+q.at[0])+':'+(y+q.at[1]));}for(let [x,y] of shape(p)){let a=x+at[0],b=y+at[1];if(a<0||b<0||a>=l.w||b>=l.h||used.has(a+':'+b))return false;}return true;}
function rounded(x,y,w,h,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,8);ctx.fill();}
function drawPiece(p,x,y){let s=shape(p),[w,h]=dims(s);ctx.save();if(p.kind==='panda'&&img.complete&&img.naturalWidth){ctx.translate(x+w*step/2,y+h*step/2);ctx.rotate(p.rot*Math.PI/2);ctx.drawImage(img,-3*step/2,-2*step/2,3*step,2*step);}else{for(let [a,b] of s){rounded(x+a*step+2,y+b*step+2,cell-4,cell-4,p.kind==='panda'?'#f7d7a2':p.id==='B'?'#aed6ed':p.id==='C'?'#c5e6bb':'#edcba5');ctx.fillStyle='#263945';ctx.font='bold 23px system-ui';ctx.fillText(p.id,x+a*step+25,y+b*step+50);}}if(selection===p){ctx.strokeStyle='#e8881c';ctx.lineWidth=3;ctx.strokeRect(x-2,y-2,w*step,h*step);}ctx.restore();}
function draw(){let l=levels[index];ctx.clearRect(0,0,C.width,C.height);board.x=(C.width-l.w*step)/2;board.y=40;rounded(board.x-12,board.y-12,l.w*step+21,l.h*step+21,'#839e89');for(let y=0;y<l.h;y++)for(let x=0;x<l.w;x++)rounded(board.x+x*step,board.y+y*step,cell,cell,'#fff9ea');ctx.font='bold 17px system-ui';ctx.fillStyle='#4f565e';ctx.fillText('待放置动物',40,370);for(let p of pieces){if(held&&p===held.p)continue;drawPiece(p,p.at?board.x+p.at[0]*step:p.tray.x,p.at?board.y+p.at[1]*step:p.tray.y);}if(held){let [w,h]=dims(shape(held.p)),x=mouse.x-w*step/2,y=mouse.y-h*step/2;let at=[Math.round((x-board.x)/step),Math.round((y-board.y)/step)];if(mouse.x>=board.x&&mouse.x<=board.x+l.w*step&&mouse.y>=board.y&&mouse.y<=board.y+l.h*step){ctx.fillStyle=legal(held.p,at)?'#3da86a44':'#df474744';for(let [a,b] of shape(held.p)){let px=board.x+(at[0]+a)*step,py=board.y+(at[1]+b)*step;if(px>=board.x&&py>=board.y&&px<board.x+l.w*step&&py<board.y+l.h*step)ctx.fillRect(px,py,cell,cell);}}ctx.globalAlpha=.83;drawPiece(held.p,x,y);ctx.globalAlpha=1;}}
function local(e){let r=C.getBoundingClientRect();return {x:(e.clientX-r.left)*C.width/r.width,y:(e.clientY-r.top)*C.height/r.height};}
function locate(v){for(let j=pieces.length-1;j>=0;j--){let p=pieces[j],x=p.at?board.x+p.at[0]*step:p.tray.x,y=p.at?board.y+p.at[1]*step:p.tray.y;for(let [a,b] of shape(p))if(v.x>=x+a*step&&v.x<x+a*step+cell&&v.y>=y+b*step&&v.y<y+b*step+cell)return p;}return null;}
function start(i){index=i;pieces=levels[i].blocks.map((p,j)=>({id:p.id,kind:p.kind,base:p.cells,rot:0,at:null,tray:{x:95+j*180,y:405}}));held=null;selection=null;document.getElementById('next').disabled=true;document.getElementById('next').textContent=i===2?'完成游戏':'下一关';document.getElementById('message').textContent='第 '+(i+1)+' / 3 关';document.getElementById('done').style.display='none';draw();}
C.addEventListener('pointerdown',e=>{if(e.button!==0)return;let p=locate(local(e));if(!p)return;held={p,origin:p.at?[...p.at]:null};selection=p;mouse=local(e);C.setPointerCapture(e.pointerId);draw();});
C.addEventListener('pointermove',e=>{if(held){mouse=local(e);draw();}});
C.addEventListener('pointerup',e=>{if(!held)return;let v=local(e),p=held.p,[w,h]=dims(shape(p)),at=[Math.round((v.x-w*step/2-board.x)/step),Math.round((v.y-h*step/2-board.y)/step)];let inside=v.x>=board.x&&v.x<board.x+levels[index].w*step&&v.y>=board.y&&v.y<board.y+levels[index].h*step;if(inside&&legal(p,at))p.at=at;else if(!inside)p.at=null;else p.at=held.origin;held=null;let done=pieces.every(q=>q.at)&&pieces.reduce((n,q)=>n+q.base.length,0)===levels[index].w*levels[index].h;document.getElementById('next').disabled=!done;document.getElementById('message').textContent=done?'本关完成':'第 '+(index+1)+' / 3 关';draw();});
C.addEventListener('pointercancel',()=>{held=null;draw();});
function rotate(){let p=held?.p||selection;if(!p)return;let old=p.rot;p.rot=(p.rot+1)%4;if(p.at&&!legal(p,p.at))p.rot=old;draw();}
document.getElementById('rotate').onclick=rotate;document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'){e.preventDefault();rotate();}});document.getElementById('reset').onclick=()=>start(index);document.getElementById('next').onclick=()=>{if(index===2){document.getElementById('done').style.display='block';document.getElementById('next').disabled=true;}else start(index+1);};img.onload=draw;start(0);
</script></html>
